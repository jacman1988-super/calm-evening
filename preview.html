<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calm Evening · local preview</title><link rel="stylesheet" href="preview.css"></head>
<body><main class="shell"><header><a class="brand" href="#">◒ <span>Calm Evening</span></a><button id="language" class="text-button" type="button">Polski</button></header>
<section class="intro"><p class="eyebrow" id="eyebrow"></p><h1 id="headline"></h1><p class="lead" id="lead"></p><p class="notice" id="fictional"></p></section>
<div class="layout"><section class="panel"><div class="section-title"><h2 id="schedule-title"></h2><span class="pill" id="local-pill"></span></div><form id="schedule-form"><div id="tasks"></div><button class="primary" id="check" type="submit"></button></form><p class="hint" id="window-hint"></p><div class="agent-panel"><h3 id="agent-title"></h3><p class="hint" id="agent-privacy"></p><label for="agent-goal" id="agent-goal-label"></label><select id="agent-goal"><option id="agent-options" value="options"></option><option id="agent-check" value="check"></option></select><div class="agent-actions"><button type="button" class="primary" id="agent-run" disabled></button><button type="button" class="text-button" id="agent-cancel" hidden></button></div><p class="hint" id="agent-status" role="status"></p></div></section>
<section class="panel results" aria-live="polite" aria-atomic="true"><p class="eyebrow" id="result-label"></p><h2 id="result-title"></h2><p id="result-summary"></p><div id="conflicts"></div><div id="options"></div><p class="hint" id="result-note"></p><div id="agent-trace"></div></section></div>
<footer><p id="footer"></p><p id="limits"></p></footer></main><script defer src="browser-runtime.js"></script></body></html>
